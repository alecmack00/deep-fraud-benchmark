# Data Configuration for Enterprise Fraud Sequence Benchmark

raw_paths:
  transaction_csv: "data/raw/train_transaction.csv"
  identity_csv: "data/raw/train_identity.csv"
  paysim_csv: "data/raw/PS_2017364724410115.csv"

processed_paths:
  merged_parquet: "data/processed/merged_transactions.parquet"
  train_parquet: "data/processed/train_transactions.parquet"
  dev_parquet: "data/processed/dev_transactions.parquet"
  test_parquet: "data/processed/test_transactions.parquet"
  sequence_tensors_dir: "data/processed/sequences"
  preprocessor_artifact: "models/checkpoints/preprocessor.joblib"

schema:
  target_col: "isFraud"
  time_col: "TransactionDT"
  join_key: "TransactionID"
  entity_cols:
    - "card1"
    - "card2"
    - "card3"
    - "card4"
    - "addr1"
    - "D1"
  synthesized_entity_col: "card_id"

# Stratified temporal split: 80% Train, 10% Dev, 10% Held-out Test
split_ratios:
  train: 0.80
  dev: 0.10
  test: 0.10

cross_validation:
  n_splits: 5
  purge_buffer_seconds: 86400  # 24.0 hours * 3600 (TransactionDT represents epoch seconds)
  purge_buffer_hours: 24.0

feature_engineering:
  correlation_threshold: 0.90
  cyclical_encoding: true
  missing_categorical_token: "MISSING"

sequence:
  window_length: 10
  stride: 1
  min_history: 1  # Minimum event count to form a window; single-event cards (N=1) are left zero-padded to (1, 10, D)
